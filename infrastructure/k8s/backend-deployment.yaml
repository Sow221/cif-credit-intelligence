apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cif
  labels:
    app: cif
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cif
      tier: backend
  template:
    metadata:
      labels:
        app: cif
        tier: backend
    spec:
      containers:
        - name: api
          image: ghcr.io/sow221/cif-credit-intelligence-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://cif:$(POSTGRES_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)"
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef: { name: cif-config, key: DATABASE_HOST }
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef: { name: cif-config, key: DATABASE_PORT }
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef: { name: cif-config, key: DATABASE_NAME }
            - name: MODEL_PATH
              valueFrom:
                configMapKeyRef: { name: cif-config, key: MODEL_PATH }
            - name: MLFLOW_TRACKING_URI
              valueFrom:
                configMapKeyRef: { name: cif-config, key: MLFLOW_TRACKING_URI }
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cif-secrets
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
