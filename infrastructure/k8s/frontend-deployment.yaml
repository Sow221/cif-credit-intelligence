apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cif
  labels:
    app: cif
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cif
      tier: frontend
  template:
    metadata:
      labels:
        app: cif
        tier: frontend
    spec:
      containers:
        - name: web
          image: ghcr.io/sow221/cif-credit-intelligence-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 256Mi
