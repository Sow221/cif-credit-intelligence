# Configuration Prometheus - CIF Credit Intelligence
# Scrape l'API (metriques /metrics) et le serveur MLflow.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "cif-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: "mlflow"
    static_configs:
      - targets: ["mlflow:5000"]

