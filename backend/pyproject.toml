[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cif-credit-intelligence-backend"
version = "1.0.0"
description = "CIF Credit Intelligence - Backend API (Standard Production Elite)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.128.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.7.1",
    "pydantic-settings==2.3.3",
    "joblib==1.4.2",
    "xgboost==3.2.0",
    "scikit-learn==1.8.0",
    "numpy==2.0.0",
    "pandas==2.2.2",
    "PyJWT==2.8.0",
    "slowapi==0.1.9",
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.1",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "black==24.4.2",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "pre-commit==3.7.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
