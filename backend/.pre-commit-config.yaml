repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 24.10.0
    hooks:
      - id: black
        args: [--check]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        args: [src]
        additional_dependencies:
          - pydantic>=2.0.0
          - sqlalchemy>=2.0.0
          - fastapi>=0.100.0

  - repo: local
    hooks:
      - id: pytest
        name: pytest (backend)
        entry: python -m pytest tests -q
        language: system
        pass_filenames: false
        always_run: true