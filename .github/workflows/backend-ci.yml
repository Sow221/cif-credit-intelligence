name: backend-ci

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "mlops/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "mlops/**"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: cif
          POSTGRES_PASSWORD: cif
          POSTGRES_DB: cif
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U cif -d cif"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dependances (dev)
        working-directory: backend
        run: |
          pip install -e ".[dev]"

      - name: Restaurer les artefacts ML (secret ARTIFACTS_BASE64)
        env:
          ARTIFACTS_BASE64: ${{ secrets.ARTIFACTS_BASE64 }}
        run: |
          mkdir -p ../mlops/artifacts
          if [ -n "$ARTIFACTS_BASE64" ]; then
            echo "$ARTIFACTS_BASE64" | base64 -d > ../mlops/artifacts/MODEL_OFFICIAL.joblib
            echo "artefact restaure"
          else
            echo "ARTEFACT ABSENT : definir le secret ARTIFACTS_BASE64 pour des tests ML complets"
          fi

      - name: Appliquer la migration Alembic
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://cif:cif@localhost:5440/cif
        run: alembic upgrade head

      - name: Qualite (ruff, black, mypy)
        working-directory: backend
        run: |
          ruff check src/
          black --check src/
          mypy src/ --strict

      - name: Tests unitaires
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://cif:cif@localhost:5440/cif
        run: pytest tests/unit -q

      - name: Tests d'integration
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://cif:cif@localhost:5440/cif
        run: pytest tests/integration -q

      - name: Couverture totale (>= 90 %)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://cif:cif@localhost:5440/cif
        run: pytest tests/ --cov=src --cov-fail-under=90
