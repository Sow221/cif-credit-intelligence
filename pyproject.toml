[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cif-credit-intelligence"
version = "0.1.0"
description = "CIF Credit Intelligence — Infrastructure de décision et de suivi du risque crédit pour les institutions financières africaines (scoring + validation méthodologique + production-ready)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary — usage interne et de démonstration. Ne pas redistribuer sans autorisation." }
authors = [{ name = "CIF Credit Intelligence Team" }]
keywords = ["credit-scoring", "machine-learning", "microfinance", "financial-inclusion", "west-africa", "decision-engine"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial",
    "Intended Audience :: Financial and Insurance Industry",
]

dependencies = [
    # Data & science
    "numpy>=1.26,<2.0",
    "pandas>=2.1,<3.0",
    "scikit-learn>=1.4,<1.6",
    "xgboost>=2.0,<3.0",
    "joblib>=1.3",
    "scipy>=1.11",
    "shap>=0.44",
    # Config & typage
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "PyYAML>=6.0",
    # MLflow pour le suivi d'expériences et le registre de modèles
    "mlflow>=2.10",
    # DP / API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.5",
    # Validation/évaluation complémentaires
    "evidently>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "httpx>=0.27",
    "dvc>=3.0",
]
test = ["pytest>=8.0", "pytest-cov>=4.1", "httpx>=0.27"]

[project.scripts]
cifci-train = "cifci.models.train:main"
cifci-predict = "cifci.api.cli:predict_cli"
cifci-prepare = "cifci.pipeline.stages:prepare_main"
cifci-run-train = "cifci.pipeline.stages:train_main"
cifci-evaluate = "cifci.pipeline.stages:evaluate_main"

[tool.hatch.build.targets.wheel]
packages = ["src/cifci"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Conventions ML idiomatiques : X/y/X_train/X_val sont explicites et lisibles
# pour les matrices de features ; on ne les renomme pas en minuscules.
"src/cifci/models/*.py" = ["N803", "N806", "B008"]
"src/cifci/evaluate/*.py" = ["N803", "N806"]
"src/cifci/explain/*.py" = ["N803", "N806"]
"src/cifci/features/build.py" = ["N806"]
"src/cifci/decision/*.py" = ["N803"]
"tests/test_features_build.py" = ["N806"]
"tests/test_api.py" = ["N806"]
"tests/test_models_decision.py" = ["N806"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
mypy_path = "src"
ignore_missing_imports = true
